
name: Generate Futuristic Visual Effects

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Matrix Rain
        uses: N1k0droid/matrix-svg-contrib@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Constellation
        uses: Sur1ive/contribution-fx@v1
        with:
          github_user_name: Mohit26-BM
          outputs: |
            dist/constellation.svg?theme=constellation&palette=ocean&mode=dark
            dist/constellation-light.svg?theme=constellation&palette=ocean&mode=light

      - name: Deploy animations
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
